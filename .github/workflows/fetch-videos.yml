# Kolbi · Video-Archiv holen (fertige TikTok/Reels-Videos für die Video-Übersicht)
#
# Liest supplement-lab/marketing/content/higgsfield/videos.json (.videos: Name → Quell-URL) und legt ab:
#   supplement-lab/marketing/videos/<name>.mp4  (720×1280, H.264 + AAC-Ton, ≤ 8 MB, faststart)
#   supplement-lab/marketing/videos/<name>.jpg  (Poster, Sekunde 1)

name: Kolbi Video-Archiv holen

on:
  workflow_dispatch:
  push:
    branches: [claude/supplement-tracking-app-hwna5s]
    paths: [supplement-lab/marketing/content/higgsfield/videos.json, .github/workflows/fetch-videos.yml]

permissions:
  contents: write

concurrency:
  group: kolbi-videos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  videos:
    name: Videos laden und verkleinern
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/supplement-tracking-app-hwna5s

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq ffmpeg

      - name: Laden und umwandeln
        env:
          SRC: supplement-lab/marketing/content/higgsfield/videos.json
          OUT: supplement-lab/marketing/videos
          MAX_BYTES: "8388608"
        run: |
          set -euo pipefail
          mkdir -p "$OUT"; tmp="$(mktemp -d)"
          jq -r '.videos | to_entries[] | "\(.key)\t\(.value)"' "$SRC" | while IFS=$'\t' read -r name url; do
            case "$name" in (*[!A-Za-z0-9_-]*|"") echo "::error::Ungültiger Name: $name"; exit 1;; esac
            case "$url" in (https://*) ;; (*) echo "::error::Nur https-URLs: $url"; exit 1;; esac
            out="$OUT/$name.mp4"
            if [ -f "$out" ]; then echo "= $name (schon da)"; continue; fi
            echo "→ $name"
            curl -fsSL --retry 3 --max-time 180 -o "$tmp/$name.mp4" "$url" < /dev/null
            for crf in 24 26 28 30 32; do
              ffmpeg -nostdin -loglevel error -y -i "$tmp/$name.mp4" \
                -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,setsar=1" \
                -c:v libx264 -preset slow -profile:v high -pix_fmt yuv420p -crf "$crf" \
                -c:a aac -b:a 128k -movflags +faststart "$out"
              size=$(stat -c %s "$out"); echo "   CRF $crf → $size Bytes"
              [ "$size" -le "$MAX_BYTES" ] && break
            done
            ffmpeg -nostdin -loglevel error -y -ss 1 -i "$out" -frames:v 1 -vf scale=360:-2 -q:v 4 "$OUT/$name.jpg"
            ls -l "$out" "$OUT/$name.jpg"
          done

      - name: Committen und pushen (nur bei Änderungen)
        run: |
          set -euo pipefail
          git add -- supplement-lab/marketing/videos
          if git diff --cached --quiet; then echo "Keine neuen Videos."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Video-Archiv: fertige Videos aus videos.json"
          git pull --rebase origin claude/supplement-tracking-app-hwna5s
          git push origin HEAD:claude/supplement-tracking-app-hwna5s
