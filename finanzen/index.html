<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mein Geld & Auto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mein Geld">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --surface:#fff; --surface-2:#f1f0ed; --line:#e7e6e1;
  --text:#111; --text-2:#55544f; --muted:#8d8c86;
  --inc:#008300; --fix:#2a78d6; --var:#eb6834; --res:#1baf7a; --debt:#e34948; --car:#6250d6;
  --good:#127a3a; --good-bg:#e7f5ec; --warn:#8a5a00; --warn-bg:#fdf3dc; --bad:#b42318; --bad-bg:#fdeae8;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121211; --surface:#1b1b1a; --surface-2:#252524; --line:#2f2f2d;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --inc:#0ca30c; --fix:#3987e5; --var:#d95926; --res:#199e70; --debt:#e66767; --car:#9085e9;
    --good:#6fd08c; --good-bg:#15301e; --warn:#f2c260; --warn-bg:#33290f; --bad:#ff8a80; --bad-bg:#3a1a18;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:max(14px, env(safe-area-inset-top)) 14px 80px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top .m{flex:1;text-align:center;font-size:19px;font-weight:700}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.nav button{border:0;background:transparent;color:var(--text-2);border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px}
.nav button.on{background:var(--text);color:var(--surface)}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer}
button.round{width:42px;height:42px;padding:0;border-radius:50%;font-size:16px}
button.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
button.block{width:100%;font-weight:600}
button.link{border:0;background:none;color:var(--text-2);padding:6px 4px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
button.x{border:0;background:none;color:var(--muted);padding:4px 8px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:500;color:var(--muted);font-size:13px}
/* Hero */
.hero{text-align:center;padding:22px 16px 18px}
.hero .lbl{color:var(--text-2);font-size:14px}
.hero .big{font-size:44px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 6px}
.hero .big.good{color:var(--good)} .hero .big.warn{color:var(--warn)} .hero .big.bad{color:var(--bad)}
.hero .sub{color:var(--text-2);font-size:14px}
.tip{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:14px;background:var(--good-bg);text-align:left}
.tip.warn{background:var(--warn-bg)} .tip.bad{background:var(--bad-bg)}
/* Checklist */
.prog{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:-2px 0 8px}
.prog span{display:block;height:100%;background:var(--text);border-radius:4px}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}
.it{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.sec + .it{border-top:0}
.chk{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--c);background:transparent;padding:0;display:grid;place-items:center;font-size:14px;color:#fff}
.chk.on{background:var(--c)}
.it .n{flex:1;min-width:0}
.it .n small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.amt{border:0;background:none;padding:4px 2px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;white-space:nowrap;border-radius:8px}
.amt:hover{background:var(--surface-2)}
.amt small{display:block;font-size:12px;font-weight:600}
.ico{font-size:20px;width:26px;text-align:center;flex:none}
.it button.n{border:0;background:none;padding:2px 0;text-align:left;font-size:16px;color:var(--text);flex:1;min-width:0}
.it .n small.save,.amt.save,.pos,b.pos{color:var(--good)}
.savepill{display:inline-block;margin-top:10px;background:var(--good-bg);color:var(--good);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.calc{margin-top:12px;padding:10px 12px 4px;background:var(--surface-2);border-radius:14px}
.calc .line{border-top:0;padding:5px 0}
.calc .line.now{border-top:2px solid var(--line);margin-top:4px;padding-top:9px;font-size:18px;font-weight:750}
.adds{grid-template-columns:1fr 1fr !important}
.savebtn{background:var(--good-bg);color:var(--good);border-color:transparent}
.sbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}
.sbar > div{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}
.sbar span{display:flex;flex-direction:column;font-size:12px;color:var(--text-2)}
.sbar b{font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.sbar b.good{color:var(--good)} .sbar b.warn{color:var(--warn)} .sbar b.bad{color:var(--bad)} .sbar b.pos{color:var(--good)}
.toast{bottom:90px !important}
.up{color:var(--bad)} .down{color:var(--good)} .muted{color:var(--muted)} .t2{color:var(--text-2)}
.adds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.adds button{font-size:13px;padding:10px 6px;font-weight:600}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.line:first-of-type{border-top:0}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.line.total{font-weight:700;border-top:2px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));display:inline-block;flex:none;margin-right:8px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
details.more > summary{cursor:pointer;color:var(--text-2);font-size:14px;list-style:none;padding:4px 0}
details.more > summary::before{content:'▸ '} details.more[open] > summary::before{content:'▾ '}
/* Auto */
.car{border-top:1px solid var(--line)}
.car:first-of-type{border-top:0}
.car > summary{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.car > summary::-webkit-details-marker{display:none}
.car .n{flex:1;min-width:0}
.car .n small{display:block;color:var(--muted);font-size:13px}
.car .when{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.car .when small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.car .body{padding:0 0 14px 20px;font-size:14px;color:var(--text-2)}
.car .acts{display:flex;gap:8px;margin:10px 0}
.car .acts button{flex:1;font-size:14px}
.hist{margin:6px 0;padding:0;list-style:none;font-size:13px}
.hist li{padding:3px 0}
/* Formulare */
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--fix);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--text)}
input.num,input.ist{text-align:right;font-variant-numeric:tabular-nums}
textarea{min-height:64px;resize:vertical;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--text-2)}
.inline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 88px 60px;gap:6px;align-items:center;padding:5px 0}
.ed.sub{grid-template-columns:88px minmax(0,1fr) 60px;border-top:1px solid var(--line);padding-top:10px}
.ed.sub > input:first-child{grid-column:1 / -1}
.ed > span:last-child{display:flex;justify-content:flex-end}
.ed.off input{opacity:.5}
.grid{display:grid;gap:10px} .g2{grid-template-columns:1fr 1fr}
.settings > details{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px}
.settings > details > summary{padding:15px 16px;font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.settings > details > summary::after{content:'›';color:var(--muted);transition:transform .15s}
.settings > details[open] > summary::after{transform:rotate(90deg)}
.settings > details > div{padding:0 16px 16px}
.settings p{font-size:14px;color:var(--text-2)}
.settings pre{background:var(--surface-2);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap}
dialog{border:0;border-radius:20px;background:var(--surface);color:var(--text);padding:20px;max-width:440px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 12px;font-size:18px}
.dlg-actions{display:flex;gap:8px;margin-top:16px}
.dlg-actions button{flex:1}
.banner{background:var(--warn-bg);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner div{display:flex;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>
  <nav class="nav" id="tabs"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* =========================================================
   Diese Datei enthält KEINE persönlichen Daten.
   Deine Zahlen kommen einmalig per privatem Link (#d=…) oder
   per Backup-Import aufs Gerät und bleiben nur dort gespeichert.
   ========================================================= */
const KEY = 'fin-auto-cockpit-v1';
const APP_URL = location.protocol === 'https:' ? location.origin + location.pathname : '';

function seed(){
  const t = new Date(), d0 = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0');
  const due = n => { const x = new Date(t.getFullYear(), t.getMonth() + n, t.getDate()); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
  const item = (id, name, m, km, info) => ({ id, name, intervalMonths:m, intervalKm:km, nextDue:due(m), info, note:'', history:[], snoozed:0 });
  return {
    schema: 1, template: true,
    settings: { bufferTarget: 300, startMonth: d0, openingBalance: 0, reminderDay: 28 },
    incomes: [ { id:'inc-gehalt', name:'Gehalt (netto)', amount:0, from:'', variable:false, note:'' } ],
    expenses: [
      { id:'ex-miete', name:'Miete', cat:'wohnen', type:'fix', amount:0, note:'' },
      { id:'ex-strom', name:'Strom', cat:'wohnen', type:'fix', amount:0, note:'' },
      { id:'ex-lebensmittel', name:'Lebensmittel', cat:'alltag', type:'variabel', amount:0, note:'' },
      { id:'ex-freizeit', name:'Freizeit', cat:'alltag', type:'variabel', amount:0, note:'' },
      { id:'ex-abos', name:'Abos', cat:'digital', type:'fix', amount:0, fromSubs:true, note:'' }
    ],
    subs: [], debts: [],
    pots: [ { id:'pot-auto', name:'Auto-Rücklage', start:0, withdrawals:[] } ],
    months: {},
    car: { name:'Mein Auto', details:'', handoverDate:due(0), handoverKm:null, kmPerYear:15000, kmLog:[], handoverNote:'',
      items: [ item('car-oel','Motoröl & Ölfilter',12,15000,'Jährlich bzw. alle 15.000 km.'), item('car-reifen','Reifen, Bremsbeläge & Wischer',6,null,'Sichtprüfung beim Reifenwechsel.'),
        item('car-pollen','Innenraum- / Pollenfilter',24,30000,'Alle 2 Jahre / 30.000 km.'), item('car-bremsfl','Bremsflüssigkeit',24,null,'Alle 2 Jahre.'), item('car-hu','HU / AU (TÜV)',24,null,'Alle 2 Jahre.') ] }
  };
}

/* ================= Hilfsfunktionen ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'x') + '-' + Math.random().toString(36).slice(2,9);
const r2 = x => Math.round(x*100)/100;
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const EUR = new Intl.NumberFormat('de-DE', { style:'currency', currency:'EUR' });
const eur = x => x == null || isNaN(x) ? '—' : EUR.format(x);
const eur0 = x => x == null || isNaN(x) ? '—' : new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(x);
const numIn = x => x == null ? '' : String(r2(x)).replace('.', ',');
const KM = x => x == null ? '—' : new Intl.NumberFormat('de-DE').format(Math.round(x)) + ' km';
const MN = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function pISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d || 1); }
const TODAY = iso(new Date());
const THIS_YM = TODAY.slice(0,7);
function addMonths(s, n){
  const [y,m,d] = s.split('-').map(Number);
  const t = new Date(y, m-1+n, 1);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(d || 1, last)); return iso(t);
}
const addYM = (ym, n) => addMonths(ym + '-01', n).slice(0,7);
function addDays(s, n){ const d = pISO(s); d.setDate(d.getDate() + Math.round(n)); return iso(d); }
const daysBetween = (a, b) => Math.round((pISO(b) - pISO(a)) / 864e5);
const ymLabel = ym => { const [y,m] = ym.split('-').map(Number); return MN[m-1] + ' ' + y; };
const ymShort = ym => { const [y,m] = ym.split('-').map(Number); return MS[m-1] + ' ' + String(y).slice(2); };
const dLabel = s => { if(!s) return '—'; const [y,m,d] = s.split('-'); return d + '.' + m + '.' + y; };
const dMonth = s => { const [y,m] = s.split('-').map(Number); return MN[m-1] + ' ' + y; };
function monthsDays(from, to){
  const neg = to < from; if (neg) [from, to] = [to, from];
  const [fy,fm,fd] = from.split('-').map(Number), [ty,tm,td] = to.split('-').map(Number);
  let m = (ty-fy)*12 + (tm-fm); if (td < fd) m--;
  const days = daysBetween(addMonths(from, m), to);
  return { m, d: days, neg };
}
function cdText(from, to){
  const { m, d, neg } = monthsDays(from, to);
  const parts = []; if (m) parts.push(m + (m === 1 ? ' Monat' : ' Monate')); parts.push(d + (d === 1 ? ' Tag' : ' Tage'));
  return (neg ? 'seit ' : '') + parts.join(' ');
}
/* "55+62,40+48" → 165,4 */
function parseAmount(v){
  if (v == null) return null;
  let s = String(v).trim().replace(/\s|€/g, '');
  if (s === '') return null;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '');
  s = s.replace(/,/g, '.');
  if (!/^[-+]?\d*\.?\d+([+-]\d*\.?\d+)*$/.test(s)) return NaN;
  return r2(s.match(/[+-]?\d*\.?\d+/g).reduce((a, t) => a + parseFloat(t), 0));
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); }

/* ================= Speicher ================= */
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch(e) { console.warn(e); }
  return seed();
}
function normalize(d){
  const s = seed();
  for (const k of Object.keys(s)) if (d[k] == null && k !== 'template') d[k] = s[k];
  d.settings = Object.assign({}, s.settings, d.settings);
  d.car = Object.assign({}, s.car, d.car);
  d.pots.forEach(p => p.withdrawals = p.withdrawals || []);
  return d;
}
let S = load();
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
const ui = { tab: localStorage.getItem(KEY + ':tab') || 'home', month: null };

/* ================= Konstanten Darstellung ================= */
const TYPES = {
  fix:       { label:'Fixkosten',        c:'var(--fix)' },
  variabel:  { label:'Variable Kosten',  c:'var(--var)' },
  ruecklage: { label:'Rücklagen',        c:'var(--res)' },
  schulden:  { label:'Schulden / Raten', c:'var(--debt)' }
};
const CATS = { wohnen:'Wohnen', auto:'Auto', alltag:'Alltag', digital:'Digitales', schulden:'Schulden / Raten', sonstiges:'Sonstiges' };

/* ================= Finanz-Logik ================= */
const subMonthly = s => s.interval === 'jahr' ? s.amount / 12 : s.amount;
const subsTotal = () => r2(sum(S.subs.filter(s => s.active), subMonthly));
function currentPlan(m){
  return {
    incomes: S.incomes.filter(i => !i.from || i.from <= m).map(i => ({ id:i.id, name:i.name, amount:Number(i.amount)||0, variable:!!i.variable, note:i.note||'' })),
    expenses: S.expenses.filter(e => e.active !== false).map(e => ({
      id:e.id, name:e.name, cat:e.cat, type:e.type, note:e.note||'',
      amount: e.fromSubs ? subsTotal() : (Number(e.amount)||0), debt:e.debt||null, pot:e.pot||null, fromSubs:!!e.fromSubs }))
  };
}
const rec = m => S.months[m] || {};
function ensureRec(m){
  if (!S.months[m]) S.months[m] = { incomeIst:{}, expenseIst:{}, extraIncome:[], oneOffs:[], payments:[], savings:[], dates:{}, note:'', closed:false, opening:null };
  const r = S.months[m]; ['extraIncome','oneOffs','payments','savings'].forEach(k => r[k] = r[k] || []); r.dates = r.dates || {};
  return r;
}
const planFor = m => { const r = rec(m); return r.closed && r.snapshot ? r.snapshot : currentPlan(m); };

let memo = new Map();
function calc(m){
  if (memo.has(m)) return memo.get(m);
  const r = rec(m), p = planFor(m);
  const inc = p.incomes.map(i => { const ist = r.incomeIst?.[i.id]; return { ...i, soll:i.amount, ist: ist ?? null, eff: ist ?? i.amount }; });
  const exp = p.expenses.map(e => { const ist = r.expenseIst?.[e.id]; return { ...e, soll:e.amount, ist: ist ?? null, eff: ist ?? e.amount }; });
  const extra = r.extraIncome || [], one = r.oneOffs || [], pay = r.payments || [], sav = r.savings || [];
  const incSoll = sum(inc, x => x.soll), incIst = sum(inc, x => x.eff) + sum(extra, x => x.amount);
  const expSoll = sum(exp, x => x.soll), expIst = sum(exp, x => x.eff) + sum(one, x => x.amount);
  const payT = sum(pay, x => x.amount), savT = sum(sav, x => x.amount);
  let opening;
  if (r.opening != null) opening = r.opening;
  else if (m <= S.settings.startMonth) opening = Number(S.settings.openingBalance) || 0;
  else opening = calc(addYM(m, -1)).closing;
  const result = incIst - expIst, resultSoll = incSoll - expSoll;
  const closing = opening + result - payT - savT;
  const target = Number(S.settings.bufferTarget) || 0;
  const buffer = Math.max(0, Math.min(closing, target)), free = closing - buffer;
  const byType = {}; for (const t in TYPES) byType[t] = { soll: sum(exp.filter(e => e.type === t), x => x.soll), ist: sum(exp.filter(e => e.type === t), x => x.eff) };
  const lines = inc.length + exp.length, checked = inc.filter(x => x.ist != null).length + exp.filter(x => x.ist != null).length;
  const isSave = e => e.type === 'ruecklage';
  const inChecked = sum(inc.filter(x => x.ist != null), x => x.ist) + sum(extra, x => x.amount);
  const outChecked = sum(exp.filter(x => x.ist != null && !isSave(x)), x => x.ist) + sum(one, x => x.amount) + payT;
  const savedChecked = sum(exp.filter(x => x.ist != null && isSave(x)), x => x.ist) + savT;
  const nowLeft = opening + inChecked - outChecked - savedChecked;
  const savedPlan = sum(exp.filter(isSave), x => x.eff) + savT;
  const out = { m, r, inc, exp, extra, one, pay, sav, savT, inChecked, outChecked, savedChecked, nowLeft, savedPlan, incSoll, incIst, expSoll, expIst, payT, opening, result, resultSoll, closing, buffer, free, target, byType, lines, checked, closed: !!r.closed, touched: !!S.months[m] };
  memo.set(m, out); return out;
}
function debtStatus(d){
  let regular = 0, extra = 0, lastExtra = null;
  for (const m of Object.keys(S.months).sort()) {
    const r = S.months[m];
    if (r.closed) regular += sum(planFor(m).expenses.filter(e => e.debt === d.id), e => r.expenseIst?.[e.id] ?? e.amount);
    const ps = (r.payments || []).filter(p => p.debt === d.id);
    if (ps.length) { extra += sum(ps, p => p.amount); lastExtra = m; }
  }
  const paid = regular + extra;
  const remaining = d.startBalance == null || d.startBalance === '' ? null : Math.max(0, d.startBalance - paid);
  const rate = sum(S.expenses.filter(e => e.debt === d.id && e.active !== false), e => e.amount);
  const monthsLeft = remaining != null && rate > 0 ? Math.ceil(remaining / rate) : null;
  return { regular, extra, paid, remaining, rate, monthsLeft, lastExtra, done: remaining === 0 };
}
function potStatus(p){
  let inflow = 0;
  for (const m of Object.keys(S.months)) { const r = S.months[m]; if (r.closed) inflow += sum(planFor(m).expenses.filter(e => e.pot === p.id), e => r.expenseIst?.[e.id] ?? e.amount); }
  const wd = sum(p.withdrawals, w => w.amount);
  const carCosts = p.id === 'pot-auto' ? sum(S.car.items.flatMap(i => i.history), h => h.fromPot ? h.cost : 0) : 0;
  return { inflow, wd, carCosts, balance: (Number(p.start)||0) + inflow - wd - carCosts };
}
function lastExtraPaymentMonth(){

function kmPoints(){
  const pts = [...S.car.kmLog];
  if (S.car.handoverKm != null) pts.push({ date:S.car.handoverDate, km:S.car.handoverKm });
  S.car.items.forEach(i => i.history.forEach(h => { if (h.km != null) pts.push({ date:h.date, km:h.km }); }));
  return pts.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.km - b.km);
}
function kmRate(){
  const pts = kmPoints();
  if (pts.length >= 2) { const a = pts[0], b = pts.at(-1); const dd = daysBetween(a.date, b.date); if (dd >= 30 && b.km > a.km) return { perDay:(b.km - a.km)/dd, measured:true }; }
  return { perDay:(Number(S.car.kmPerYear)||16000)/365, measured:false };
}
function kmNow(){
  const pts = kmPoints(); if (!pts.length) return null;
  const last = pts.at(-1), rate = kmRate().perDay;
  const est = last.km + Math.max(0, daysBetween(last.date, TODAY)) * rate;
  return { km: est, last, estimated: last.date < TODAY };
}
function itemDue(it){
  const baseKm = it.lastKm ?? S.car.handoverKm;
  let dueKm = it.intervalKm && baseKm != null ? baseKm + Number(it.intervalKm) : null;
  if (it.dueKmAbs && (dueKm == null || it.dueKmAbs < dueKm)) dueKm = it.dueKmAbs;
  const now = kmNow(), rate = kmRate().perDay;
  let kmLeft = null, kmDate = null;
  if (dueKm != null && now) { kmLeft = dueKm - now.km; kmDate = addDays(TODAY, kmLeft / rate); }
  const byKm = kmDate && kmDate < it.nextDue && !it.dueKmAbs;
  const eff = byKm ? kmDate : it.nextDue;
  const days = daysBetween(TODAY, eff);
  const status = days < 0 ? 'over' : (days <= 60 || (kmLeft != null && kmLeft <= 1500)) ? 'soon' : 'ok';
  const lastDate = it.history.at(-1)?.date || S.car.handoverDate;
  const span = Math.max(1, daysBetween(lastDate, eff)), elapsed = Math.min(span, Math.max(0, daysBetween(lastDate, TODAY)));
  const recentDone = it.history.length && daysBetween(it.history.at(-1).date, TODAY) <= 30;
  return { dueKm, kmLeft, kmDate, eff, byKm, days, status, pct: Math.round(elapsed / span * 100), recentDone };
}

/* ================= Bericht ================= */
function report(){
  const m = ui.month, c = calc(m);
  const L = [];
  L.push(`MONATS-CHECK ${ymLabel(m).toUpperCase()} (${c.closed ? 'abgeschlossen' : 'offen'}, Stand ${dLabel(TODAY)})`);
  L.push(`Einnahmen: ${eur(c.incIst)} (Soll ${eur(c.incSoll)})`);
  L.push(`Ausgaben: ${eur(c.expIst)} (Soll ${eur(c.expSoll)})`);
  L.push(`Sondertilgungen: ${eur(c.payT)}`);
  L.push(`Monatsergebnis: ${eur(c.result)} | Übertrag ${eur(c.opening)} → Monatsende ${eur(c.closing)} (Puffer ${eur(c.buffer)}, frei ${eur(c.free)})`);
  const dev = [...c.inc, ...c.exp].filter(x => x.ist != null && Math.abs(x.ist - x.soll) >= 0.01);
  L.push('', 'Abweichungen:'); L.push(...(dev.length ? dev.map(x => `- ${x.name}: ${eur(x.ist)} statt ${eur(x.soll)} (${x.ist > x.soll ? '+' : ''}${eur(x.ist - x.soll)})`) : ['- keine eingetragen']));
  const unchecked = c.exp.filter(x => x.ist == null).map(x => x.name); if (unchecked.length) L.push('Nicht geprüft: ' + unchecked.join(', '));
  if (c.extra.length) L.push('Extra-Einnahmen: ' + c.extra.map(x => `${x.name} ${eur(x.amount)}`).join(', '));
  if (c.one.length) L.push('Einmalausgaben: ' + c.one.map(x => `${x.name} ${eur(x.amount)}`).join(', '));
  if (c.sav.length) L.push('Gespart/umgebucht: ' + c.sav.map(x => `${x.name} ${eur(x.amount)}`).join(', '));
  if (c.pay.length) L.push('Sondertilgungen: ' + c.pay.map(p => `${S.debts.find(d => d.id === p.debt)?.name} ${eur(p.amount)}`).join(', '));
  if (c.r.note) L.push('Notiz: ' + c.r.note);
  L.push('', 'Offene Posten:'); S.debts.forEach(d => { const s = debtStatus(d); L.push(`- ${d.name}: ${s.done ? 'abgelöst' : s.remaining == null ? 'Restschuld unbekannt' : eur(s.remaining)}${s.extra ? ` (Sondertilgung gesamt ${eur(s.extra)})` : ''}`); });
  S.pots.forEach(p => L.push(`- ${p.name}: ${eur(potStatus(p).balance)}`));
  L.push('', `Abos aktiv: ${S.subs.filter(s => s.active).map(s => `${s.name} ${eur(s.amount)}/${s.interval === 'jahr' ? 'Jahr' : 'Monat'}`).join('; ')}`);
  const now = kmNow(); L.push('', `Auto: km ${now ? Math.round(now.km) + (now.estimated ? ' (geschätzt)' : '') : 'unbekannt'}`);
  S.car.items.map(i => ({ i, d:itemDue(i) })).sort((a,b) => a.d.eff < b.d.eff ? -1 : 1).slice(0,3).forEach(({i,d}) => L.push(`- ${i.name}: ${dMonth(d.eff)} (${STATUS[d.status].t})`));
  return L.join('\n');
}

function openDlg(html, onSave){
  const d = $('#dlg'); d.innerHTML = html; d.showModal();
  d.onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); d.querySelector('[data-dlg="save"]')?.click(); } };
  d.onclick = e => {
    if (e.target === d) d.close();
    const a = e.target.closest('[data-dlg]'); if (!a) return;
    const act = a.dataset.dlg;
    if (act === 'cancel') { d.close(); return; }
    if (act !== 'copy') { if (onSave(d, act) !== false) { d.close(); save(); render(); } return; }
    if (act === 'copy') { const t = d.querySelector('textarea'); t.select(); (navigator.clipboard?.writeText(t.value) || Promise.reject()).then(() => toast('Kopiert ✓'), () => { document.execCommand('copy'); toast('Kopiert ✓'); }); }
  };
}

  tab: d => { ui.tab = d.k; localStorage.setItem(KEY + ':tab', d.k); window.scrollTo({ top:0 }); },
  mPrev: () => { ui.month = addYM(ui.month, -1); },
  mNext: () => { ui.month = addYM(ui.month, 1); },
  tick: d => { const r = ensureRec(ui.month), key = d.k === 'inc' ? 'incomeIst' : 'expenseIst';
    if (r[key][d.id] != null) { delete r[key][d.id]; delete r.dates[d.id]; return; }
    r.dates[d.id] = defDate(ui.month);
    r[key][d.id] = (d.k === 'inc' ? calc(ui.month).inc : calc(ui.month).exp).find(x => x.id === d.id).soll; },
  editAmt: d => { dlgAmount(d.k, d.id); return false; },
  dlgExtra: () => { dlgExtra(); return false; },
  dlgOne: () => { dlgOne(); return false; },
  dlgPay: () => { dlgPay(); return false; },
  dlgSave: () => { dlgSave(); return false; },
  calAll: () => { openCalendar(buildICS(null)); return false; },
  calOne: d => { openCalendar(buildICS(d.id)); return false; },
  hintOk: () => { localStorage.setItem(KEY + ':hint', '1'); },
  dlgOpening: () => { dlgOpening(); return false; },
  dlgKm: () => { dlgKm(); return false; },
  dlgWd: () => { dlgWd(); return false; },
  close: () => {
    const c = calc(ui.month), r = ensureRec(ui.month);
    c.inc.forEach(i => { if (i.ist == null) r.incomeIst[i.id] = i.soll; });
    c.exp.forEach(x => { if (x.ist == null) r.expenseIst[x.id] = x.soll; });
    r.snapshot = currentPlan(ui.month); r.closed = true;
    toast(ymLabel(ui.month) + ' abgeschlossen ✓'); ui.month = addYM(ui.month, 1); window.scrollTo({ top:0 });
  },
  reopen: () => { const r = ensureRec(ui.month); r.closed = false; delete r.snapshot; },
  delList: d => { const r = ensureRec(ui.month); r[d.list] = r[d.list].filter(x => x.id !== d.id); },
  payOff: d => { const debt = S.debts.find(x => x.id === d.id), s = debtStatus(debt); if (!s.remaining) return false;
    if (!confirm(`${debt.name}: ${eur(s.remaining)} im ${ymLabel(ui.month)} ablösen?`)) return false;
    ensureRec(ui.month).payments.push({ id:uid('pay'), debt:debt.id, amount:s.remaining, note:'Ablöse' }); debt.clarified = true; toast('Abgelöst ✓'); },
  addIncome: () => { S.incomes.push({ id:uid('inc'), name:'Neue Einnahme', amount:0, from:'', variable:false, note:'' }); },
  addExpense: () => { S.expenses.push({ id:uid('ex'), name:'Neue Ausgabe', cat:'sonstiges', type:'fix', amount:0, note:'' }); },
  addSub: () => { S.subs.push({ id:uid('sub'), name:'Neues Abo', amount:0, interval:'monat', active:true, billingMonth:'' }); },
  toggleSub: d => { const s = S.subs.find(x => x.id === d.id); s.active = !s.active; toast(s.active ? 'Abo aktiv' : 'Abo pausiert'); },
  toggleExp: d => { const e = S.expenses.find(x => x.id === d.id); e.active = e.active === false; },
  delColl: d => { const o = coll(d.coll).find(x => x.id === d.id); if (!confirm(`„${o.name}“ löschen?`)) return false; S[d.coll] = S[d.coll].filter(x => x.id !== d.id); },
  delWd: d => { const p = S.pots.find(x => x.id === d.pot); p.withdrawals = p.withdrawals.filter(w => w.id !== d.id); },
  carDone: d => { carDoneDlg(S.car.items.find(i => i.id === d.id)); return false; },
  carSnooze: d => { const it = S.car.items.find(i => i.id === d.id); it.nextDue = addMonths(it.nextDue, 1); it.snoozed = (it.snoozed || 0) + 1; toast('Verschoben auf ' + dMonth(it.nextDue)); },
  carEdit: d => { carEditDlg(S.car.items.find(i => i.id === d.id)); return false; },
  carAdd: () => { carEditDlg(null); return false; },
  carDel: d => { if (!confirm('Wartungspunkt löschen?')) return false; S.car.items = S.car.items.filter(i => i.id !== d.id); $('#dlg').close(); },
  delHist: d => { const it = S.car.items.find(i => i.id === d.item); it.history = it.history.filter(h => h.id !== d.id); },
  report: () => { openDlg(`<h3>Monatsbericht – ${ymLabel(ui.month)}</h3><textarea style="min-height:300px;font-size:12px;font-family:ui-monospace,Menlo,monospace" readonly>${esc(report())}</textarea><div class="dlg-actions"><button data-dlg="cancel">Schließen</button><button class="primary" data-dlg="copy">Kopieren</button></div>`, () => {}); return false; },
  export: () => { const b = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'mein-geld-backup-' + TODAY + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return false; },
  import: () => { $('#importFile').click(); return false; },
  reset: () => { if (!confirm('Wirklich alles zurücksetzen? Vorher Backup speichern!')) return false; S = seed(); ui.month = null; },
  pasteLink: () => { const v = ($('#linkIn')?.value || '').trim(); const m = v.match(/[#&]d=([A-Za-z0-9_-]+)/) || v.match(/^([zj][A-Za-z0-9_-]{20,})$/); if (!m) { toast('Kein gültiger Link'); return false; } importCode(m[1], true); return false; },

};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.closest('summary') && el.tagName !== 'BUTTON') return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (fn(el.dataset) === false) { if (el.dataset.act === 'carDel') { save(); render(); } return; }
  save(); render();
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.expenses || !d.months) throw new Error('format'); S = normalize(d); ui.month = null; save(); render(); toast('Backup geladen ✓'); }
  catch(err) { alert('Diese Datei ist kein gültiges Backup.'); }
  e.target.value = '';
});
/* ================= Import per privatem Link ================= */
async function decodeCode(code){
  const t = code[0]; let b = code.slice(1).replace(/-/g, '+').replace(/_/g, '/'); b += '='.repeat((4 - b.length % 4) % 4);
  const bin = Uint8Array.from(atob(b), c => c.charCodeAt(0));
  if (t === 'z') return JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
  return JSON.parse(new TextDecoder().decode(bin));
}
function applyPlan(p, fresh){
  if (fresh) { const months = S.template ? {} : S.months; S = normalize({ ...JSON.parse(JSON.stringify(p)), months }); delete S.template; return; }
  S.incomes = p.incomes; S.expenses = p.expenses; S.subs = p.subs;
  S.settings = { ...S.settings, bufferTarget:p.settings.bufferTarget, reminderDay:p.settings.reminderDay ?? S.settings.reminderDay };
  S.debts = p.debts.map(d => { const o = S.debts.find(x => x.id === d.id); return o ? { ...d, startBalance: d.startBalance ?? o.startBalance, clarified: d.clarified || o.clarified } : d; });
  S.pots = p.pots.map(q => { const o = S.pots.find(x => x.id === q.id); return o ? { ...q, withdrawals:o.withdrawals } : { ...q, withdrawals:q.withdrawals || [] }; });
  const oldItems = S.car.items;
  S.car = { ...p.car, handoverDate:S.car.handoverDate || p.car.handoverDate, handoverKm:p.car.handoverKm ?? S.car.handoverKm, kmLog:S.car.kmLog,
    items: p.car.items.map(i => { const o = oldItems.find(x => x.id === i.id); return o ? { ...i, nextDue:o.history.length || o.snoozed ? o.nextDue : i.nextDue, lastKm:o.lastKm, history:o.history, note:o.note, snoozed:o.snoozed } : i; })
      .concat(oldItems.filter(o => !p.car.items.some(i => i.id === o.id))) };
}
async function importCode(code, force){
  let payload; try { payload = await decodeCode(code); if (!payload.data || !payload.data.expenses) throw 0; } catch(e) { toast('Link ungültig'); return; }
  const seen = (localStorage.getItem(KEY + ':imports') || '').split(',').filter(Boolean);
  if (!force && seen.includes(payload.id)) return;
  const fresh = !!S.template || !Object.keys(S.months).length;
  applyPlan(payload.data, fresh);
  if (!seen.includes(payload.id)) seen.push(payload.id);
  localStorage.setItem(KEY + ':imports', seen.join(','));
  ui.month = null; save(); render(); toast(fresh ? 'Deine Daten sind geladen ✓' : 'Planung aktualisiert ✓');
}

/* ================= Kalender (ICS) ================= */
const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function icsFold(line){ const cp = Array.from(line), out = []; let cur = ''; for (const ch of cp) { if (new TextEncoder().encode(cur + ch).length > 72) { out.push(cur); cur = ' ' + ch; } else cur += ch; } out.push(cur); return out.join('\r\n'); }
const icsDate = s => s.replace(/-/g, '');
function buildICS(onlyId){
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ev = [], link = APP_URL ? '\n\nApp öffnen: ' + APP_URL : '';
  const allDay = (uidKey, date, title, desc, alarms) => {
    ev.push(['BEGIN:VEVENT', `UID:${uidKey}-${icsDate(date)}@mein-geld`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(date)}`, `DTEND;VALUE=DATE:${icsDate(addDays(date, 1))}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc + link)}`, 'TRANSP:TRANSPARENT',
      ...alarms.flatMap(tr => ['BEGIN:VALARM', 'ACTION:DISPLAY', `TRIGGER:${tr}`, `DESCRIPTION:${icsEsc(title)}`, 'END:VALARM']), 'END:VEVENT']);
  };
  if (!onlyId) {
    const day = Math.min(28, Math.max(1, Math.round(S.settings.reminderDay || 28)));
    let first = TODAY.slice(0, 8) + String(day).padStart(2, '0'); if (first < TODAY) first = addMonths(first, 1);
    ev.push(['BEGIN:VEVENT', 'UID:monatscheck@mein-geld', `DTSTAMP:${stamp}`, `DTSTART:${icsDate(first)}T190000`, 'DURATION:PT15M', `RRULE:FREQ=MONTHLY;BYMONTHDAY=${day}`,
      `SUMMARY:${icsEsc('💶 Monats-Check: Abbuchungen abhaken')}`, `DESCRIPTION:${icsEsc('Kontoauszug öffnen, Abbuchungen abhaken, Monat abschließen. Danach Backup speichern.' + link)}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT0M', 'DESCRIPTION:Monats-Check', 'END:VALARM', 'END:VEVENT']);
    S.debts.filter(d => d.withdrawUntil && TODAY <= d.withdrawUntil).forEach(d => allDay('frist-' + d.id, d.withdrawUntil, '⏳ Widerrufsfrist endet: ' + d.name, 'Letzter Tag für den Widerruf.', ['-P1DT15H', '-PT15H']));
  }
  S.car.items.filter(i => !onlyId || i.id === onlyId).forEach(i => {
    const d = itemDue(i);
    allDay(i.id, d.eff, (ICON[i.id] || '🔧') + ' ' + S.car.name + ': ' + i.name, (i.info || '') + (d.dueKm != null ? `\nSpätestens bei ${KM(d.dueKm)}.` : '') + '\nNach dem Termin in der App „Erledigt“ antippen.', ['-P13DT15H', '-PT15H']);
  });
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mein Geld//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', ...ev.flat(), 'END:VCALENDAR'].map(icsFold).join('\r\n') + '\r\n';
}
function openCalendar(ics){
  if (APP_URL) {
    const bytes = new TextEncoder().encode(ics); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    const c = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    window.open(new URL('api/ics?c=' + c, location.href).href, '_blank');
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar' })); a.download = 'erinnerungen.ics'; a.click();
  }
  toast('Kalender öffnet sich – „Alle hinzufügen“ tippen');
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
const hashCode = location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
if (hashCode) importCode(hashCode[1]);
</script>
